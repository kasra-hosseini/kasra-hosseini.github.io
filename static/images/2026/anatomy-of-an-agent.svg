<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -25 740 675" font-family="system-ui, -apple-system, sans-serif">
<rect x="0" y="-25" width="740" height="675" fill="#ffffff"/>

<!-- Arrowhead markers -->
<defs>
<marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M 0 0 L 10 4 L 0 8 Z" fill="#1e1b4b"/>
</marker>
</defs>

<!-- === SECTION 1: The Loop === -->

<!-- Agent box -->
<rect x="60" y="60" width="200" height="65" rx="8" fill="#f5f3ff" stroke="#1e1b4b" stroke-width="2"/>
<text x="160" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1b4b">Agent</text>
<text x="160" y="110" text-anchor="middle" font-size="10.5" fill="#6b7280">foundation model + scaffolding</text>

<!-- Environment box -->
<rect x="480" y="60" width="200" height="65" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="580" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#059669">Environment</text>
<text x="580" y="110" text-anchor="middle" font-size="10.5" fill="#6b7280">the world the agent acts on</text>

<!-- Action arrow: Agent -> Environment, arcs ABOVE -->
<path d="M 260 58 C 320 0, 420 0, 480 58" fill="none" stroke="#1e1b4b" stroke-width="2.5" marker-end="url(#arr)"/>

<!-- action label above the arc -->
<text x="370" y="-13" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7f1d1d">Action</text>
<text x="370" y="0" text-anchor="middle" font-size="9" fill="#6b7280">(generate text, call tools, run code)</text>

<!-- Observation arrow: Environment -> Agent, arcs BELOW -->
<path d="M 480 120 C 420 175, 320 175, 260 120" fill="none" stroke="#1e1b4b" stroke-width="2.5" marker-end="url(#arr)"/>

<!-- observation label below the arc -->
<text x="370" y="185" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f766e">Observation</text>
<text x="370" y="200" text-anchor="middle" font-size="9" fill="#6b7280">(result, response, error)</text>

<!-- The Loop + subtitle centered between arcs -->
<text x="370" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1b4b">The Loop</text>
<text x="370" y="103" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">act, observe, repeat</text>

<!-- === Small arrow from Agent to bottom panel === -->
<line x1="160" y1="125" x2="160" y2="230" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
<polygon points="160,230 155,220 165,220" fill="#94a3b8"/>

<!-- === SECTION 2: Inside the Agent === -->
<rect x="70" y="235" width="600" height="315" rx="14" fill="#fafafe" stroke="#1e1b4b" stroke-width="2"/>
<text x="90" y="260" font-size="13" font-weight="bold" fill="#1e1b4b">Inside the Agent</text>
<text x="90" y="276" font-size="10" fill="#6b7280" font-style="italic">the scaffolding (harness) wraps the foundation model</text>

<!-- Foundation Model (centered, the reasoning core) -->
<rect x="195" y="288" width="310" height="66" rx="10" fill="#ede9fe" stroke="#1e1b4b" stroke-width="2.2"/>
<text x="350" y="315" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Foundation Model</text>
<text x="350" y="337" text-anchor="middle" font-size="11.5" fill="#5b21b6">the reasoning core</text>

<!-- Scaffolding label -->
<text x="90" y="378" font-size="10" fill="#2563eb" font-style="italic">Scaffolding (the harness)</text>

<!-- Row 1: Prompt (first-class) + Tools & Skills + Memory -->
<rect x="90" y="386" width="180" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<text x="180" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Prompt</text>
<text x="180" y="425" text-anchor="middle" font-size="9.5" fill="#6b7280">instructions, task, intent</text>

<rect x="280" y="386" width="180" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<text x="370" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Tools &amp; Skills</text>
<text x="370" y="425" text-anchor="middle" font-size="9.5" fill="#6b7280">MCP, functions, skills</text>

<rect x="470" y="386" width="180" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<text x="560" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Memory</text>
<text x="560" y="425" text-anchor="middle" font-size="9.5" fill="#6b7280">working, episodic, procedural</text>

<!-- Row 2: Planning + Identity + Self-Evaluation -->
<rect x="90" y="472" width="180" height="50" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="180" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">Planning</text>
<text x="180" y="511" text-anchor="middle" font-size="9.5" fill="#6b7280">decompose, predict, choose</text>

<rect x="280" y="472" width="180" height="50" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="370" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">Identity</text>
<text x="370" y="511" text-anchor="middle" font-size="9.5" fill="#6b7280">trained character + persona</text>

<rect x="470" y="472" width="180" height="50" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="560" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">Self-Evaluation</text>
<text x="560" y="511" text-anchor="middle" font-size="9.5" fill="#6b7280">stop or iterate?</text>

<!-- === SECTION 3: Autonomy Spectrum === -->
<text x="370" y="575" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">From model call to autonomous agent</text>

<line x1="80" y1="605" x2="660" y2="605" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="80" cy="605" r="5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="270" cy="605" r="5" fill="#7c3aed" opacity="0.5"/>
<circle cx="460" cy="605" r="5" fill="#7c3aed"/>
<polygon points="660,605 650,600 650,610" fill="#7c3aed"/>

<!-- Labels -->
<text x="80" y="625" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">LLM call</text>
<text x="80" y="639" text-anchor="middle" font-size="9" fill="#6b7280">one input, one output</text>

<text x="270" y="625" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">workflow</text>
<text x="270" y="639" text-anchor="middle" font-size="9" fill="#6b7280">fixed chain of steps</text>

<text x="460" y="625" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">agentic loop</text>
<text x="460" y="639" text-anchor="middle" font-size="9" fill="#6b7280">dynamic, iterative</text>

<text x="645" y="625" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">fully autonomous</text>
<text x="645" y="639" text-anchor="middle" font-size="9" fill="#6b7280">self-directed</text>


</svg>
